[workspace]
git_only = true
release_always = false
git_tag_enable = false
git_release_enable = false
git_tag_name = "v{{ version }}"
changelog_update = false
semver_check = false
dependencies_update = false
pr_name = "chore: release v{{ version }}"

[[package]]
name = "xila"
release = true
version_group = "xila"
changelog_update = true
git_tag_enable = true
git_release_enable = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "abi_declarations",
  "abi_definitions",
  "authentication",
  "bootsplash",
  "calculator",
  "command_line_shell",
  "device",
  "drivers_core",
  "drivers_espressif",
