  "graphics",
  "graphics_bindgen",
  "little_fs",
  "log",
  "memory",
  "native_example",
  "network",
  "peripherals",
  "settings",
  "shared",
  "synchronization",
  "target",
  "task",
  "task_macros",
  "terminal",
  "testing",
  "time",
  "users",
  "virtual_file_system",
  "wasm",
  "wasm_example",
  "wasm_wasm_test",
  "weather",
]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
git_release_draft = true
git_release_latest = false

