name: Check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-translation:
    name: WASM translation (${{ matrix.memory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        memory: [memory_32, memory_64]
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup | Coverage and Miri components
        run: |
          rustup component add --toolchain stable llvm-tools-preview
          rustup component add --toolchain nightly miri rust-src

      - name: Check | Translation coverage
        run: >-
          cargo +stable llvm-cov
          --manifest-path executables/wasm_2/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}
          --ignore-filename-regex '(tests\.rs|tests/translation/src/lib\.rs)$'
          --fail-under-lines 100 --fail-under-functions 100

      - name: Check | Translation Miri
        run: >-
          cargo +nightly miri test
          --manifest-path executables/wasm_2/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}

      - name: Check | Borrowing compile-fail doctests
        run: >-
          cargo +stable test --doc
          --manifest-path executables/wasm_2/tests/translation/Cargo.toml
          --no-default-features --features ${{ matrix.memory }}

      - name: Check | 64-bit guest on 32-bit host (Miri)
        if: matrix.memory == 'memory_64'
        run: >-
          cargo +nightly miri test
          --manifest-path executables/wasm_2/tests/translation/Cargo.toml
          --no-default-features --features memory_64
          --target i686-unknown-linux-gnu

      - name: Check | Little-endian ABI on big-endian host (Miri)
        if: matrix.memory == 'memory_32'
        run: >-
          cargo +nightly miri test
          --manifest-path executables/wasm_2/tests/translation/Cargo.toml
          --no-default-features --features memory_32
          --target powerpc-unknown-linux-gnu

  format:
    name: Format checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup | Install cargo-taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli@0.9.3

      - name: Check | Formatting (TOML)
        run: cargo make format-toml --check

      - name: Check | Formatting (Rust)
        run: cargo make format-rust -- --check

      - name: Check | Formatting (JSON)
        run: npm exec prettier -- --check "**/*.json"

  host:
    name: Host checks
    needs: [format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check | Clippy (Host)
        run: cargo make clippy-host

      - name: Check | Clippy (Host - wasm_abi_bindings)
        run: cargo +stable clippy -p wasm_abi_bindings --features bindings_generation,wasm32

      - name: Check | Documentation (Host)
        run: RUSTDOCFLAGS="--deny warnings" cargo make doc-host

      - name: Build | Example (Native)
        run: cargo make build -p native_example

      - name: Run | Test
        run: cargo make coverage --lcov --output-path lcov.info

      - name: Upload | Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required for private repos or protected branches
          slug: Xila-Project/Core
          files: lcov.info
          fail_ci_if_error: true

  guest:
    name: Guest checks
    needs: [format]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup | Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check | Clippy (Guest)
        run: cargo make clippy-guest

      - name: Check | Documentation (Guest)
        run: RUSTDOCFLAGS="--deny warnings" cargo make doc-guest

      - name: Build | Example (WASM)
        working-directory: ./examples/wasm
        run: trunk build
