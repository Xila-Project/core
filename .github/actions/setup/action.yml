name: "Setup"
description: "Use the shared Devbox environment for Xila checks and builds"

runs:
  using: "composite"
  steps:
    - name: Setup | Read Devbox version
      id: devbox-version
      shell: bash
      run: echo "version=$(cat .devbox-version)" >> "$GITHUB_OUTPUT"

    - name: Setup | Devbox
      uses: jetify-com/devbox-install-action@1af623155b1203817421a7efe5574f59f4a055c6
      with:
        devbox-version: ${{ steps.devbox-version.outputs.version }}
        enable-cache: true

    - name: Setup | Cache toolchains and downloads
      uses: actions/cache@v4
      with:
        path: .dev-environment
        key: ${{ runner.os }}-${{ runner.arch }}-xila-tools-${{ hashFiles('development/toolchains.env', 'devbox.lock', 'package-lock.json') }}

    - name: Setup | Rust targets and npm dependencies
      shell: bash
      run: devbox run setup

    - name: Setup | Configure Rust cache paths
      shell: bash
      run: |
        source development/toolchains.env
        echo "CARGO_HOME=$GITHUB_WORKSPACE/.dev-environment/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$GITHUB_WORKSPACE/.dev-environment/rustup" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$XILA_RUST_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/.devbox/nix/profile/default/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/.dev-environment/cargo/bin" >> "$GITHUB_PATH"

    - name: Setup | Rust build cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ hashFiles('development/toolchains.env', 'devbox.lock') }}
