[package]
name = "wasm_2"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

[dependencies]
wasmi = { version = "1.1.0", default-features = false, features = [
  "prefer-btree-collections",
  "extra-checks",
], optional = true }
xila = { path = "../../", optional = true }
getargs-derive = { git = "https://github.com/AlixANNERAUD/getargs-derive.git", branch = "main", optional = true }
getargs = { version = "0.5", optional = true }

[features]
guest = []
host = ["dep:wasmi", "dep:xila", "dep:getargs-derive", "dep:getargs"]
default = ["host", "memory_32"]
memory_32 = []
memory_64 = []
graphics = [
  "xila?/graphics",
  "dep:graphics_bindgen",
  "dep:lvgl_rust_sys",
  "dep:quote",
]

[build-dependencies]
graphics_bindgen = { path = "../../modules/graphics/bindings_generator", optional = true }
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", default-features = false, optional = true }
quote = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
abi_definitions = { workspace = true }
command_line_shell = { workspace = true }
executable = { workspace = true, features = ["building"] }
testing = { workspace = true }
wat = "1"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
