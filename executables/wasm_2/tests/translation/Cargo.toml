[package]
name = "wasm_translation_tests"
version = "0.1.0"
edition = "2024"
publish = false

# Test the actual translation sources without building the OS/runtime integration.
[workspace]

[dependencies]
wasmi = { version = "1.1.0", default-features = false, features = [
  "prefer-btree-collections",
  "extra-checks",
] }

[features]
default = ["memory_32"]
memory_32 = []
memory_64 = []
