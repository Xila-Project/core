[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

[dependencies]
xila = { path = "../../", optional = true }
wasm_abi_bindings = { path = "bindings", optional = true }
wamr-rust-sdk = { git = "https://github.com/bytecodealliance/wamr-rust-sdk.git", features = [
  "multi-module",
  "instruction-metering",
], optional = true }
getargs = { version = "0.5" }
getargs-derive = { workspace = true }
smol_str = { workspace = true }
synchronization = { workspace = true }

[features]
default = []
graphics = []
c_bindings = []
host = ["dep:xila", "dep:wamr-rust-sdk", "dep:wasm_abi_bindings"]
guest = []
wasm32 = ["wasm_abi_bindings/wasm32"]
wasm64 = ["wasm_abi_bindings/wasm64"]
default_host = ["host", "graphics", "wasm32"]
default_guest = ["guest", "graphics", "c_bindings"]

[build-dependencies]
wasm_abi_bindings = { path = "bindings", features = [
  "wasm32",
] } # To force the build script to run when the bindings are updated
lvgl_rust_sys = { git = "https://github.com/Xila-Project/lvgl_rust_sys.git", default-features = false }
bindgen = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "visit", "extra-traits"] }
target = { workspace = true }
proc-macro2 = { workspace = true }
cbindgen = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
abi_definitions = { workspace = true }
command_line_shell = { workspace = true }
executable = { workspace = true, features = ["building"] }
testing = { workspace = true }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
