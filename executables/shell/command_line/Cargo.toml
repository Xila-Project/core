[package]
name = "command_line_shell"
version.workspace = true
publish.workspace = true
edition = "2024"

[dependencies]
xila = { path = "../../../" }
getargs = { version = "0.5" }
getargs-derive = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
task = { workspace = true, features = ["test_harness"] }
drivers_native = { workspace = true }
drivers_core = { workspace = true }
drivers_shared = { workspace = true }
drivers_std = { workspace = true }
time = { workspace = true }
little_fs = { workspace = true }
testing = { workspace = true }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
